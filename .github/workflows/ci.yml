name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      oracle:
        image: gvenzl/oracle-free:23-slim-faststart
        env:
          ORACLE_PASSWORD: ci-oracle
          APP_USER: veti
          APP_USER_PASSWORD: veti
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Testes unitários (AAA, sem banco)
        run: ./mvnw -B test

      - name: Gerar JAR
        run: ./mvnw -B -DskipTests package

      - name: Subir API
        env:
          DB_URL: jdbc:oracle:thin:@//localhost:1521/FREEPDB1
          DB_INIT_MODE: always
          DB_USER: veti
          DB_PASSWORD: veti
          JWT_SECRET: ci-secret
          ADMIN_EMAIL: admin@veti.test
          ADMIN_PASSWORD: Admin@ci-123
        run: |
          nohup java -jar target/veti-0.0.1-SNAPSHOT.jar > app.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf http://localhost:8080/health && exit 0
            sleep 2
          done
          cat app.log
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Testes de API (Newman)
        run: |
          npx --yes newman@6 run api-tests/veti.postman_collection.json \
            --env-var baseUrl=http://localhost:8080/veti \
            --env-var healthUrl=http://localhost:8080/health \
            --env-var adminEmail=admin@veti.test \
            --env-var adminPassword=Admin@ci-123

      - name: Logs da API
        if: always()
        run: tail -n 200 app.log || true
