<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <title>Arquitetura CI/CD da Veti na Azure - Opcao PaaS</title>
  <desc>DevOps Engineer e usuario final, IDE, GitHub, Azure Pipelines, App Service, PostgreSQL, Key Vault e Application Insights, com os passos 1 a 6 do fluxo CI/CD.</desc>
  <rect width="1280" height="760" fill="#f7f9fc"/>
  <text x="40" y="42" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#12344d">Arquitetura da solu&#231;&#227;o - Op&#231;&#227;o PaaS</text>
  <text x="40" y="68" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#4a6274">Personas, componentes e o fluxo numerado de CI/CD. Aplica&#231;&#227;o e banco fora de container.</text>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#1d4e89"/>
    </marker>
  </defs>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="40" y="100" width="210" height="78" rx="8" fill="#e7f0fa" stroke="#1d4e89" stroke-width="1.5"/>
    <text x="145" y="132" text-anchor="middle" font-size="16" font-weight="700" fill="#12344d">DevOps Engineer</text>
    <text x="145" y="154" text-anchor="middle" font-size="13" fill="#4a6274">persona</text>
    <line x1="250" y1="139" x2="318" y2="139" stroke="#1d4e89" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="284" y="128" text-anchor="middle" font-size="12" fill="#1d4e89">usa</text>
    <rect x="328" y="100" width="170" height="78" rx="8" fill="#ffffff" stroke="#1d4e89" stroke-width="1.5"/>
    <text x="413" y="132" text-anchor="middle" font-size="16" font-weight="700" fill="#12344d">IDE</text>
    <text x="413" y="154" text-anchor="middle" font-size="13" fill="#4a6274">edi&#231;&#227;o do c&#243;digo</text>
    <line x1="498" y1="139" x2="608" y2="139" stroke="#1d4e89" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="553" y="128" text-anchor="middle" font-size="12" fill="#1d4e89">1. git push</text>
    <rect x="618" y="100" width="230" height="78" rx="8" fill="#ffffff" stroke="#1d4e89" stroke-width="1.5"/>
    <text x="733" y="132" text-anchor="middle" font-size="16" font-weight="700" fill="#12344d">GitHub</text>
    <text x="733" y="154" text-anchor="middle" font-size="13" fill="#4a6274">branch main</text>
    <line x1="733" y1="178" x2="733" y2="228" stroke="#1d4e89" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="748" y="210" font-size="12" fill="#1d4e89">2. Disparo do trigger CI</text>
    <rect x="548" y="236" width="520" height="150" rx="8" fill="#ffffff" stroke="#1d4e89" stroke-width="1.5"/>
    <text x="572" y="268" font-size="16" font-weight="700" fill="#12344d">Azure Pipelines</text>
    <text x="572" y="294" font-size="14" fill="#12344d">3. Compila&#231;&#227;o e testes - mvn test / mvn package</text>
    <text x="572" y="318" font-size="14" fill="#12344d">4. Publica&#231;&#227;o do artefato JAR</text>
    <text x="572" y="342" font-size="14" fill="#12344d">5. Disparo do CD</text>
    <text x="572" y="366" font-size="13" fill="#4a6274">Service connection Azure Resource Manager</text>
    <line x1="700" y1="386" x2="560" y2="448" stroke="#1d4e89" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="600" y="424" text-anchor="middle" font-size="12" fill="#1d4e89">6. Deploy do JAR - ARM</text>
    <rect x="40" y="456" width="210" height="84" rx="8" fill="#e7f0fa" stroke="#1d4e89" stroke-width="1.5"/>
    <text x="145" y="490" text-anchor="middle" font-size="16" font-weight="700" fill="#12344d">Usu&#225;rio final</text>
    <text x="145" y="512" text-anchor="middle" font-size="13" fill="#4a6274">persona</text>
    <line x1="250" y1="498" x2="328" y2="498" stroke="#1d4e89" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="289" y="488" text-anchor="middle" font-size="12" fill="#1d4e89">HTTPS</text>
    <rect x="338" y="448" width="280" height="100" rx="8" fill="#fff4e5" stroke="#c47b17" stroke-width="1.5"/>
    <text x="478" y="482" text-anchor="middle" font-size="16" font-weight="700" fill="#12344d">App Service</text>
    <text x="478" y="504" text-anchor="middle" font-size="13" fill="#4a6274">Web App Java 21</text>
    <text x="478" y="524" text-anchor="middle" font-size="13" fill="#4a6274">app-ccgl-rm564113</text>
    <line x1="618" y1="498" x2="708" y2="498" stroke="#1d4e89" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="663" y="488" text-anchor="middle" font-size="12" fill="#1d4e89">JDBC - TLS</text>
    <rect x="718" y="448" width="280" height="100" rx="8" fill="#e7f6ee" stroke="#1e7a46" stroke-width="1.5"/>
    <text x="858" y="482" text-anchor="middle" font-size="16" font-weight="700" fill="#12344d">PostgreSQL Flexible</text>
    <text x="858" y="504" text-anchor="middle" font-size="13" fill="#4a6274">banco PaaS - db-challenge</text>
    <text x="858" y="524" text-anchor="middle" font-size="13" fill="#4a6274">pg-ccgl-rm564113</text>
    <rect x="338" y="600" width="280" height="88" rx="8" fill="#fff8e8" stroke="#a67c00" stroke-width="1.5"/>
    <text x="478" y="634" text-anchor="middle" font-size="16" font-weight="700" fill="#12344d">Key Vault</text>
    <text x="478" y="656" text-anchor="middle" font-size="13" fill="#4a6274">segredos copiados para App Settings</text>
    <line x1="478" y1="600" x2="478" y2="548" stroke="#1d4e89" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="492" y="580" font-size="12" fill="#1d4e89">App Settings</text>
    <rect x="718" y="600" width="280" height="88" rx="8" fill="#f3e8ff" stroke="#6b3fa0" stroke-width="1.5"/>
    <text x="858" y="634" text-anchor="middle" font-size="16" font-weight="700" fill="#12344d">Application Insights</text>
    <text x="858" y="656" text-anchor="middle" font-size="13" fill="#4a6274">tracing, m&#233;tricas e Log Analytics</text>
    <line x1="560" y1="548" x2="730" y2="600" stroke="#1d4e89" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="640" y="572" font-size="12" fill="#1d4e89">telemetria</text>
  </g>
  <text x="40" y="728" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#4a6274">Op&#231;&#227;o 2 do manual: nenhum componente roda em container. ACR e ACI n&#227;o fazem parte desta arquitetura.</text>
</svg>
