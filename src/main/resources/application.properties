spring.application.name=veti

# Server (App Service define PORT/SERVER_PORT; TLS termina no front-end da Azure)
server.port=${PORT:8080}
server.forward-headers-strategy=native

# Database (Oracle; driver e dialeto sao detectados pela URL)
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}

# Tabelas e sequences sao criadas pelo Hibernate. Nunca create-drop em ambiente com dados.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Package PL/SQL (funcoes, procedures, trigger e TB_AUDITORIA), aplicado depois que o Hibernate cria as tabelas.
# O script e idempotente; cada bloco termina com uma linha "/".
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=${DB_INIT_MODE:always}
spring.sql.init.schema-locations=classpath:db/pkg_veti.sql
spring.sql.init.separator=/

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# Controller
server.servlet.context-path=/veti

#Security
api.security.token.secret=${JWT_SECRET}
# Primeiro administrador (criado na subida se ainda nao existir). O /auth/register publico so cria USER.
veti.admin.email=${ADMIN_EMAIL:}
veti.admin.password=${ADMIN_PASSWORD:}
# Login Google e opcional: so e ativado se GOOGLE_CLIENT_ID (e GOOGLE_CLIENT_SECRET) estiverem definidos.

# E-mail (SMTP do Gmail). MAIL_PASSWORD e uma "senha de app" do Google, nao a senha da conta.
# Sem MAIL_USERNAME/MAIL_PASSWORD o lembrete so e registrado no log (modo simulado, usado no CI).
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# "\u00ed" = "i" com acento: o Spring le o .properties como ISO-8859-1, entao acentos vao escapados
veti.mail.remetente-nome=${MAIL_FROM_NAME:Cl\u00ednica Veti}
# O /health nao depende do SMTP: um Gmail fora do ar nao deve derrubar a aplicacao
management.health.mail.enabled=false

# Logging estruturado (JSON Logstash no stdout; correlationId/traceId/spanId vem do MDC)
logging.structured.format.console=${LOG_FORMAT:logstash}
logging.level.root=INFO
logging.level.br.com.fiap.veti=${LOG_LEVEL_APP:INFO}

# Actuator / Health (GET /health e um alias para /veti/actuator/health, ver HealthAliasValve)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoint.health.status.order=DOWN,OUT_OF_SERVICE,DEGRADED,UP,UNKNOWN

# Metricas HTTP (tempo de resposta + taxa de erro via tags outcome/status de http.server.requests)
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
management.metrics.tags.application=${spring.application.name}

# Tracing distribuido (controller -> service via @Observed -> JDBC via datasource-micrometer)
management.observations.annotations.enabled=true
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
jdbc.includes=connection,query

# Exportacao OpenTelemetry (OTLP/HTTP). Ative com OTEL_EXPORT_ENABLED=true e OTEL_EXPORTER_OTLP_ENDPOINT.
# Alternativa Azure: APPLICATIONINSIGHTS_CONNECTION_STRING anexa o agente do Application Insights.
management.tracing.export.otlp.enabled=${OTEL_EXPORT_ENABLED:false}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
management.otlp.metrics.export.enabled=${OTEL_EXPORT_ENABLED:false}
management.otlp.metrics.export.url=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
management.otlp.metrics.export.step=${OTEL_METRICS_STEP:30s}

# Versiona CSS/imagens pelo hash do conteudo (veti-<hash>.css): o navegador nunca usa um arquivo velho do cache
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
spring.web.resources.cache.cachecontrol.max-age=365d
