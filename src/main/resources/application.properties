spring.application.name=veti

# Database
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:ccgl}
spring.datasource.password=${DB_PASSWORD:secret}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/veti-db}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# Controller
server.servlet.context-path=/veti

#Security
api.security.token.secret=${JWT_SECRET:veti-default-secret-change-in-production}
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}