spring.application.name=veti

# Server (App Service define PORT/SERVER_PORT; TLS termina no front-end da Azure)
server.port=${PORT:8080}
server.forward-headers-strategy=native

# Database
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:ccgl}
spring.datasource.password=${DB_PASSWORD:secret}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/veti-db}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Nunca create-drop em ambiente com dados. Use validate quando o schema vier do script SQL oficial.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# Controller
server.servlet.context-path=/veti

#Security
api.security.token.secret=${JWT_SECRET:veti-default-secret-change-in-production}
# Login Google e opcional: so e ativado se GOOGLE_CLIENT_ID (e GOOGLE_CLIENT_SECRET) estiverem definidos.

# Logging estruturado (JSON Logstash no stdout; correlationId/traceId/spanId vem do MDC)
logging.structured.format.console=${LOG_FORMAT:logstash}
logging.level.root=INFO
logging.level.br.com.fiap.veti=${LOG_LEVEL_APP:INFO}

# Actuator / Health (GET /health e um alias para /veti/actuator/health, ver HealthAliasValve)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoint.health.status.order=DOWN,OUT_OF_SERVICE,DEGRADED,UP,UNKNOWN

# Metricas HTTP (tempo de resposta + taxa de erro via tags outcome/status de http.server.requests)
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
management.metrics.tags.application=${spring.application.name}

# Tracing distribuido (controller -> service via @Observed -> JDBC via datasource-micrometer)
management.observations.annotations.enabled=true
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
jdbc.includes=connection,query

# Exportacao OpenTelemetry (OTLP/HTTP). Ative com OTEL_EXPORT_ENABLED=true e OTEL_EXPORTER_OTLP_ENDPOINT.
# Alternativa Azure: APPLICATIONINSIGHTS_CONNECTION_STRING anexa o agente do Application Insights.
management.tracing.export.otlp.enabled=${OTEL_EXPORT_ENABLED:false}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
management.otlp.metrics.export.enabled=${OTEL_EXPORT_ENABLED:false}
management.otlp.metrics.export.url=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
management.otlp.metrics.export.step=${OTEL_METRICS_STEP:30s}
