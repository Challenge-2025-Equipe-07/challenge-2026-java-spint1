<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Veti - Veterinários</title>
</head>
<body>
<h1>Veterinários cadastrados</h1>
<table border="1" cellpadding="8">
    <thead>
    <tr>
        <th>ID</th>
        <th>E-mail</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="vet : ${veterinarios}">
        <td th:text="${vet.id}"></td>
        <td th:text="${vet.email}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
