<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Entrar')}"></head>
<body>
<main class="login-page">
    <div class="login-card">
        <img class="logo" th:src="@{/img/logo-veti.svg}" alt="Veti">

        <form th:action="@{/auth/login}" method="post">
            <div class="alert erro" th:if="${erro}">E-mail ou senha inválidos.</div>
            <div class="alert info" th:if="${saiu}">Você saiu da sua conta.</div>

            <div class="field">
                <label for="email">Email</label>
                <input id="email" type="email" name="email" placeholder="cliente@mail.com" required autofocus>
            </div>
            <div class="field">
                <label for="password">Senha</label>
                <input id="password" type="password" name="password" placeholder="********" required>
            </div>
            <button type="submit" class="btn block">Entrar</button>

            <div class="login-extra" th:if="${googleEnabled}">
                <div class="divider">ou</div>
                <a class="btn ghost block" th:href="@{/oauth2/authorization/google}">Entrar com Google</a>
            </div>
            <p class="login-rodape">Acesso restrito à equipe da clínica</p>
        </form>
    </div>
</main>
</body>
</html>
