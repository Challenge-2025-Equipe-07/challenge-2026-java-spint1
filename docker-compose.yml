services:
  db:
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_USER: ccgl
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: veti-db

    volumes:
      - veti-data:/var/lib/postgresql

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DB_USER=ccgl
      - DB_PASSWORD=secret
      - DB_URL=jdbc:postgresql://db:5432/veti-db
      - GOOGLE_CLIENT_ID=484681037880-492aijp28gb4rndl2gi040cqj3gt0efi.apps.googleusercontent.com
      - GOOGLE_CLIENT_SECRET=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
    depends_on:
      - db

volumes:
  veti-data:
