# Pipeline CI/CD - Azure DevOps (Sprint 4)
# CI: build + testes unitarios + testes de API (Newman) + publicacao do artefato
# CD: deploy automatico do JAR no Azure Web App (Java SE 21) apos o CI gerar novo artefato
#
# Pre-requisitos no Azure DevOps:
#  - Service connection (Azure Resource Manager) com o nome em `azureServiceConnection`
#  - Variable group `veti-secrets` (Pipelines > Library) com DB_URL, DB_USER, DB_PASSWORD, JWT_SECRET, ADMIN_EMAIL, ADMIN_PASSWORD, MAIL_USERNAME e MAIL_PASSWORD,
#    todos marcados como secretos (cadeado)

trigger:
  branches:
    include:
      - master
      - main

pr: none

variables:
  - group: veti-secrets
  - name: azureServiceConnection
    value: 'veti-azure-connection'
  - name: webAppName
    value: 'veti-app'
  - name: vmImage
    value: 'ubuntu-latest'

resources:
  containers:
    # Oracle 23ai Free; o agente espera o healthcheck ficar saudavel antes dos passos do job
    - container: oracle
      image: gvenzl/oracle-free:23-slim-faststart
      ports:
        - 1521:1521
      env:
        ORACLE_PASSWORD: ci-oracle
        APP_USER: veti
        APP_USER_PASSWORD: veti
      options: --health-cmd healthcheck.sh --health-interval 10s --health-timeout 5s --health-retries 30

stages:
  - stage: CI
    displayName: 'CI - Build e Testes'
    jobs:
      - job: BuildTest
        displayName: 'Build, testes e artefato'
        pool:
          vmImage: $(vmImage)
        services:
          oracle: oracle
        steps:
          - task: JavaToolInstaller@0
            displayName: 'Instalar Java 21'
            inputs:
              versionSpec: '21'
              jdkArchitectureOption: 'x64'
              jdkSourceOption: 'PreInstalled'

          - script: ./mvnw -B test
            displayName: 'Testes unitarios (AAA, sem banco)'

          - task: PublishTestResults@2
            displayName: 'Publicar resultados dos testes unitarios'
            condition: always()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '**/surefire-reports/TEST-*.xml'
              testRunTitle: 'Testes unitarios'

          - script: ./mvnw -B -DskipTests package
            displayName: 'Gerar JAR'

          - script: |
              for i in $(seq 1 90); do
                (echo > /dev/tcp/localhost/1521) 2>/dev/null && exit 0
                sleep 2
              done
              echo "Oracle nao respondeu" && exit 1
            displayName: 'Aguardar Oracle de teste'

          - script: |
              nohup java -jar target/veti-0.0.1-SNAPSHOT.jar > app.log 2>&1 &
              for i in $(seq 1 90); do
                curl -sf http://localhost:8080/health && exit 0
                sleep 2
              done
              cat app.log
              exit 1
            displayName: 'Subir API para testes'
            env:
              DB_URL: jdbc:oracle:thin:@//localhost:1521/FREEPDB1
              DB_USER: veti
              DB_PASSWORD: veti
              JWT_SECRET: ci-secret
              ADMIN_EMAIL: admin@veti.test
              ADMIN_PASSWORD: Admin@ci-123

          - task: NodeTool@0
            displayName: 'Instalar Node 20'
            inputs:
              versionSpec: '20.x'

          - script: |
              npx --yes newman@6 run api-tests/veti.postman_collection.json \
                --env-var baseUrl=http://localhost:8080/veti \
                --env-var healthUrl=http://localhost:8080/health \
                --env-var adminEmail=admin@veti.test \
                --env-var adminPassword=Admin@ci-123 \
                --reporters cli,junit \
                --reporter-junit-export newman-results.xml
            displayName: 'Testes de API (Newman)'

          - task: PublishTestResults@2
            displayName: 'Publicar resultados dos testes de API'
            condition: always()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: 'newman-results.xml'
              testRunTitle: 'Testes de API (Newman)'

          - script: tail -n 200 app.log || true
            displayName: 'Logs da API'
            condition: always()

          # O App Service Java SE executa /home/site/wwwroot/app.jar por padrao
          - script: |
              mkdir -p $(Build.ArtifactStagingDirectory)/drop
              cp target/veti-0.0.1-SNAPSHOT.jar $(Build.ArtifactStagingDirectory)/drop/app.jar
            displayName: 'Preparar artefato'

          - task: PublishPipelineArtifact@1
            displayName: 'Publicar artefato (drop)'
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/drop'
              artifact: 'drop'

  - stage: CD
    displayName: 'CD - Deploy Azure Web App'
    dependsOn: CI
    condition: succeeded()
    jobs:
      - deployment: DeployWebApp
        displayName: 'Deploy no Azure Web App'
        pool:
          vmImage: $(vmImage)
        environment: 'veti-producao'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebApp@1
                  displayName: 'Deploy do JAR'
                  inputs:
                    azureSubscription: ${{ variables.azureServiceConnection }}
                    appType: 'webAppLinux'
                    appName: $(webAppName)
                    package: '$(Pipeline.Workspace)/drop/app.jar'
                    runtimeStack: 'JAVA|21-java21'
                    appSettings: >-
                      -DB_URL "$(DB_URL)"
                      -DB_USER "$(DB_USER)"
                      -DB_PASSWORD "$(DB_PASSWORD)"
                      -JWT_SECRET "$(JWT_SECRET)"
                      -ADMIN_EMAIL "$(ADMIN_EMAIL)"
                      -ADMIN_PASSWORD "$(ADMIN_PASSWORD)"
                      -MAIL_USERNAME "$(MAIL_USERNAME)"
                      -MAIL_PASSWORD "$(MAIL_PASSWORD)"
