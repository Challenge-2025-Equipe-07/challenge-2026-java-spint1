# Esteira CI/CD da API Veti (App Service + PostgreSQL).
# O agente é o pool self-hosted Default. A assinatura de estudante não tem
# paralelismo para agentes hospedados pela Microsoft.
#
# Service connection ARM: azure-rm-challenge
# Web App: app-ccgl-rm564113
# Environment: Production
#
# DB_URL, DB_USER, DB_PASSWORD, JWT_SECRET e a connection string ficam vazios
# de propósito. O deploy só grava um App Setting quando o valor vem preenchido,
# então os segredos que o provisionamento já gravou permanecem.

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  azureSubscription: 'azure-rm-challenge'
  resourceGroup: 'rg-challenge-devops'
  webAppName: 'app-ccgl-rm564113'
  DB_URL: ''
  DB_USER: ''
  DB_PASSWORD: ''
  JWT_SECRET: ''
  APPLICATIONINSIGHTS_CONNECTION_STRING: ''

stages:
  - stage: Build
    displayName: 'Stage 1: Build & Test (CI)'
    jobs:
      - job: BuildJob
        pool:
          name: Default
        steps:
          - checkout: self

          - task: JavaToolInstaller@0
            displayName: 'Selecionar Java 21'
            inputs:
              versionSpec: '21'
              jdkArchitectureOption: 'x64'
              jdkSourceOption: 'PreInstalled'

          - script: |
              set -euo pipefail
              chmod +x mvnw
              ./mvnw -B test
            displayName: 'Executar testes unitários (mvn test)'

          - task: PublishTestResults@2
            displayName: 'Publicar resultados dos testes unitários'
            condition: always()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '**/surefire-reports/TEST-*.xml'
              testRunTitle: 'Testes unitários'

          - script: |
              set -euo pipefail
              ./mvnw -B package -DskipTests
            displayName: 'Empacotar JAR'

          - script: |
              set -euo pipefail
              mkdir -p "$(Build.ArtifactStagingDirectory)"
              jar=$(find target -maxdepth 1 -name 'veti-*.jar' ! -name '*.original' | head -n 1)
              if [ -z "$jar" ]; then
                echo "JAR não gerado em target" >&2
                exit 1
              fi
              cp "$jar" "$(Build.ArtifactStagingDirectory)/"
            displayName: 'Preparar artefato JAR'

          - task: PublishBuildArtifacts@1
            displayName: 'Publicar artefato'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: 'drop'

  - stage: Deploy
    displayName: 'Stage 2: Deploy no Azure (CD)'
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployJob
        environment: 'Production'
        pool:
          name: Default
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: drop

                - task: AzureCLI@2
                  displayName: 'Injetar variáveis de ambiente e conexão do banco'
                  inputs:
                    azureSubscription: '$(azureSubscription)'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      settings=(DDL_AUTO=update DB_INIT_MODE=never)
                      add() {
                        local name="$1"
                        local value="$2"
                        if [ -n "$value" ]; then
                          settings+=("${name}=${value}")
                        fi
                      }
                      add DB_URL "${DB_URL:-}"
                      add DB_USER "${DB_USER:-}"
                      add DB_PASSWORD "${DB_PASSWORD:-}"
                      add JWT_SECRET "${JWT_SECRET:-}"
                      add APPLICATIONINSIGHTS_CONNECTION_STRING "${APPLICATIONINSIGHTS_CONNECTION_STRING:-}"
                      az webapp config appsettings set \
                        --resource-group "$(resourceGroup)" \
                        --name "$(webAppName)" \
                        --settings "${settings[@]}"
                      subscription=$(az account show --query id -o tsv)
                      az rest --method patch \
                        --url "https://management.azure.com/subscriptions/${subscription}/resourceGroups/$(resourceGroup)/providers/Microsoft.Web/sites/$(webAppName)/config/web?api-version=2023-12-01" \
                        --body '{"properties":{"healthCheckPath":"/health"}}'
                  env:
                    DB_URL: $(DB_URL)
                    DB_USER: $(DB_USER)
                    DB_PASSWORD: $(DB_PASSWORD)
                    JWT_SECRET: $(JWT_SECRET)
                    APPLICATIONINSIGHTS_CONNECTION_STRING: $(APPLICATIONINSIGHTS_CONNECTION_STRING)

                - task: AzureCLI@2
                  displayName: 'Implantar JAR no App Service (ARM)'
                  inputs:
                    azureSubscription: '$(azureSubscription)'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      jar=$(find "$(Pipeline.Workspace)/drop" -maxdepth 1 -name 'veti-*.jar' ! -name '*.original' | head -n 1)
                      if [ -z "$jar" ]; then
                        echo "JAR não encontrado no artefato drop" >&2
                        exit 1
                      fi
                      az webapp deploy \
                        --resource-group "$(resourceGroup)" \
                        --name "$(webAppName)" \
                        --src-path "$jar" \
                        --type jar
